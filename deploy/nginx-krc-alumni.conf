# nginx 예시: 홈페이지는 / 전체, KRC Tech는 지금처럼 /tech-blog 로 (기존 설정에 맞춰 고칠 것)
# 이미 krcalumni.com 서버 블록이 있으면 location / 와 proxy_set_header 줄만 옮겨 넣는다
server {
    server_name krcalumni.com www.krcalumni.com;
    client_max_body_size 5m;            # 팀 사진 3MB + 여유

    # (기존) KRC Tech — 지금 쓰는 설정 그대로 두고, KRC Tech가 쓰는 /api 경로만 KRC Tech로 보낸다
    # 홈페이지 API는 /api/account, /api/admin/members|teams, /api/me, /api/live, /api/push, /api/queue, /api/teams, /api/autos 라서 아래와 겹치지 않는다
    # (2026-11-23 KRC Tech 화면 코드에서 확인한 경로. KRC Tech가 경로를 늘리면 여기도 추가)
    # location /tech-blog/ { proxy_pass http://127.0.0.1:<KRC Tech 포트>; ... }
    # location ~ ^/api/(auth/|posts|discovery|covers/|categories|article-preview/|admin/accounts|admin/users) { proxy_pass http://127.0.0.1:<KRC Tech 포트>; ... }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;              # 가입 스팸 막기가 이 값을 쓴다
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    # listen 443 ssl; … (certbot이 채움)
}
